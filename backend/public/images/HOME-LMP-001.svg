<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#grad)" rx="16" />
  
  <!-- Subtle Border -->
  <rect x="8" y="8" width="584" height="384" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.25" rx="12" />

  <!-- Category Badge -->
  <rect x="32" y="32" width="140" height="28" rx="14" fill="#d97706" />
  <text x="102" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOME</text>

  <!-- City Pill -->
  <rect x="180" y="32" width="110" height="28" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-opacity="0.4" />
  <text x="235" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">📍 Bengaluru</text>

  <!-- Large Central Visual Card -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="180" r="75" fill="#ffffff" stroke="#d97706" stroke-width="3" stroke-opacity="0.4" />
    <text x="300" y="202" font-size="64" text-anchor="middle">🏡</text>
  </g>

  <!-- Product Name & Price Info -->
  <text x="300" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1e293b" text-anchor="middle">LED Architect Desk Lamp</text>
  
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">₹1,299</text>

  <!-- Quality Stamp -->
  <text x="300" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">INVENTORY HUB • QUALITY VERIFIED • HOME-LMP-001</text>
</svg>