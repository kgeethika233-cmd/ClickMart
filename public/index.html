<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Hub Storefront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --badge-out: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .btn {
      padding: 0.85rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .alert {
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      display: none;
    }

    .alert-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .stock-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
    }

    .stock-in {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .stock-out {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .buy-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .buy-form input {
      padding: 0.6rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Inventory Hub Storefront</h1>
      <p>Real-Time Inventory • ACID Stock Locking • OpenSearch Typo Search</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Try searching with a typo: 'bluetoth', 'speeker', 'cabl'...">
      <button class="btn btn-primary" onclick="handleSearch()">Search</button>
      <button class="btn btn-secondary" onclick="loadAllProducts()">Reset</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="productGrid" class="grid">
      <div class="empty-state">Loading products...</div>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alertBox');
    const productGrid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertBox.style.display = 'block';
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }

    async function loadAllProducts() {
      searchInput.value = '';
      try {
        const res = await fetch('/products');
        const products = await res.json();
        renderProducts(products);
      } catch (err) {
        showAlert('Failed to load products: ' + err.message, true);
      }
    }

    async function handleSearch() {
      const q = searchInput.value.trim();
      if (!q) {
        return loadAllProducts();
      }

      try {
        const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
        const results = await res.json();
        
        if (res.ok) {
          // OpenSearch returns only items that are in stock
          renderProducts(results.map(r => ({ ...r, quantity: r.quantity !== undefined ? r.quantity : 'In Stock' })));
          showAlert(`Found ${results.length} result(s) in OpenSearch matching "${q}"`);
        } else {
          showAlert(results.error || 'Search error', true);
        }
      } catch (err) {
        showAlert('Search error: ' + err.message, true);
      }
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    function renderProducts(products) {
      if (!products || products.length === 0) {
        productGrid.innerHTML = `<div class="empty-state">No products found. (Sold-out items are hidden from search).</div>`;
        return;
      }

      productGrid.innerHTML = products.map(p => {
        const isOutOfStock = p.quantity !== undefined && p.quantity <= 0;
        const stockLabel = isOutOfStock ? 'Sold Out' : (p.quantity !== undefined ? `${p.quantity} in stock` : 'In Stock');
        const badgeClass = isOutOfStock ? 'stock-out' : 'stock-in';

        return `
          <div class="card">
            <div>
              <div class="card-header">
                <div class="card-title">${p.name}</div>
                <span class="stock-badge ${badgeClass}">${stockLabel}</span>
              </div>
              <p class="card-desc">${p.description || 'High-performance audio accessory.'}</p>
            </div>

            <div>
              <div class="card-footer">
                <span class="price">₹${Number(p.price).toLocaleString()}</span>
              </div>

              ${!isOutOfStock ? `
                <div class="buy-form">
                  <input type="email" id="email-${p.id}" placeholder="Enter your email" value="shopper@test.com" required>
                  <button class="btn btn-primary" onclick="placeOrder(${p.id})">Buy Now (Qty: 1)</button>
                </div>
              ` : `
                <div class="buy-form">
                  <button class="btn btn-secondary" disabled style="opacity: 0.5; cursor: not-allowed;">Out of Stock</button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    async function placeOrder(productId) {
      const emailInput = document.getElementById(`email-${productId}`);
      const email = emailInput ? emailInput.value.trim() : '';

      if (!email) {
        showAlert('Please enter an email address to order.', true);
        return;
      }

      try {
        const res = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, productId, quantity: 1 }),
        });

        const data = await res.json();
        if (res.ok) {
          showAlert(`Order #${data.orderId} placed successfully! Notification event emitted to Kafka.`);
          loadAllProducts(); // refresh stock numbers
        } else {
          showAlert(data.error || 'Failed to place order', true);
        }
      } catch (err) {
        showAlert('Order error: ' + err.message, true);
      }
    }

    // Initial load
    loadAllProducts();
  </script>
</body>
</html>
